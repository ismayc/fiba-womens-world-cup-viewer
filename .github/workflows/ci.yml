name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Per-REF, so a busy pull request cancels only its own previous run. A static
# workflow-level group here (e.g. `pages`) would let any PR cancel main's queued
# CI and its deploy — a real outage this family has already had.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  pages:
    name: Deploy to GitHub Pages
    needs: test # only deploys if tests + build pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys across workflows (CI + refresh-data), never
    # mid-cancel: a half-published deploy is worse than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage:badge # writes public/coverage.json for the README badge
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Check the DEPLOYED site, which nothing else in this repo ever does: the build,
  # the tests and the jobs above all work on local files, so a dead host, a URL
  # pointing at a sibling's site, or a calendar feed that disagrees with the
  # committed schedule are invisible to the entire gate. See
  # sports-viewer-meta/docs/LINEAGES.md section 5.
  #
  # Never a required check: it depends on GitHub Pages and Netlify having finished
  # publishing, and Netlify builds from its own git trigger on its own schedule, so
  # a red run here can mean "not deployed yet" rather than "broken". It reports.
  smoke:
    name: Smoke-test production
    needs: pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Netlify's build is triggered by the same push but runs independently of
      # this workflow, so give it a moment before asking it for the feed.
      - name: Wait for the hosts to publish
        run: sleep 60
      # No `npm ci`: the script uses Node built-ins only.
      - name: Check the deployed URLs and the calendar feed
        shell: bash
        run: node scripts/smoke-prod.mjs
