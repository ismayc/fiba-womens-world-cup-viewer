<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Archivo, variable on BOTH axes (width 62-125, weight 400-800). The whole
         app is set in one family used at two extremes: expanded and heavy for
         numerals and headings, normal for text. Loading both axes is what makes
         that possible from a single file. Preconnect first: the font is on the
         critical path for the scoreboard type. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIBA Women's World Cup 2026 — Schedule Viewer</title>
    <meta
      name="description"
      content="All 36 games of the FIBA Women's Basketball World Cup 2026 in Berlin, in your timezone — scores, group standings, the final-phase bracket, and which arena each game is in."
    />
    <meta name="theme-color" content="#15171b" />
    <!-- GitHub Pages, not Netlify. This used to claim no Netlify site exists for this
         repo and that every netlify.app URL 404s; that is not true and contradicted
         src/components/CalendarModal.jsx, which subscribes to the Netlify feed.
         Checked September 6, 2026: the Netlify root, /og-image.png and /calendar.ics
         all answer 200. The real reason the card points at Pages is that Pages is this
         family's canonical public URL, matching the wnba/nba siblings. -->
    <link rel="canonical" href="https://ismayc.github.io/fiba-womens-world-cup-viewer/" />

    <!-- PWA: installable to home screen, standalone launch -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FIBA Women's World Cup 2026" />

    <!-- Open Graph (link previews in Slack/Discord/iMessage/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FIBA Women's World Cup 2026 Schedule Viewer" />
    <meta property="og:title" content="FIBA Women's World Cup 2026 — Schedule Viewer" />
    <meta
      property="og:description"
      content="All 36 games in your timezone — scores, group standings, and the final-phase bracket."
    />
    <meta property="og:url" content="https://ismayc.github.io/fiba-womens-world-cup-viewer/" />
    <meta property="og:image" content="https://ismayc.github.io/fiba-womens-world-cup-viewer/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FIBA Women's World Cup 2026 Schedule Viewer" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FIBA Women's World Cup 2026 — Schedule Viewer" />
    <meta
      name="twitter:description"
      content="All 36 games in your timezone — scores, group standings, and the final-phase bracket."
    />
    <meta name="twitter:image" content="https://ismayc.github.io/fiba-womens-world-cup-viewer/og-image.png" />
    <script>
      // Set the theme before paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem('fwwc:theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
