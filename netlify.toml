[build]
  # Deliberately just the build. Netlify builds this repo straight from Git and is the
  # fallback that keeps deploying when GitHub Actions is down — so it must not depend on
  # the test suite, where one flaky run would block the very host we fall back to.
  # public/coverage.json is committed instead, and vite copies it into dist/ for the
  # README badge; CI still fails below 100%, so the committed value cannot lie.
  command = "npm run build"
  publish = "dist"

# The calendar subscription feed (/calendar.ics) is a STATIC file, not a function:
# the 2026 tournament is complete, ESPN dropped date-range scoreboard queries (the
# feed's window now 400s), and its fiba slug will stop serving the 2026 event once it
# advances. scripts/build-calendar.mjs writes the feed into public/ (see the prebuild
# hook), vite copies it to dist/, and Netlify serves the real file before the SPA
# fallback below. It is a real file on GitHub Pages too, so the feed is no longer
# Netlify-only.

# Single-page app: serve index.html for any other path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
