<!--
  The share card's ARTWORK LAYER only: ground, rules and the mark. Flags, team
  names and all wording are composited on top by scripts/make-og-image.mjs:

    npm run og:image

  Two ImageMagick limits are why the wording is not in this file:

    * Its SVG renderer has NO font stack. A <text> element fails with an
      "unable to read font" error and ABORTS the command, leaving the PREVIOUS
      og-image.png in place, so the build appears to succeed while the card
      still advertises the old content. All wording is drawn with -annotate
      against explicit font FILES instead.
    * It paints a fill that references a gradient by url(#id) as PURE BLACK.
      This file therefore uses flat fills only and carries no gradient defs.

  The mark is the same basketball-on-Germany's-flag as public/icon.svg, so the
  tab, the home screen and the share card all show one identity. It is drawn as a
  rounded badge here rather than full-bleed, because the card's own ground is the
  app's navy.
-->
